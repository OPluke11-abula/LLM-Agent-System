name: Helm Chart CI/CD & OCI GHCR Publish

on:
  push:
    branches:
      - main
    paths:
      - "deploy/helm/**"
      - "deploy/canary/**"
      - ".github/workflows/helm-publish.yml"
  pull_request:
    branches:
      - main
    paths:
      - "deploy/helm/**"
      - "deploy/canary/**"
      - ".github/workflows/helm-publish.yml"

permissions:
  contents: read
  packages: write

jobs:
  lint-and-validate:
    name: Lint & Template Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Helm Lint
        run: |
          helm lint deploy/helm/llm-agent-system

      - name: Helm Dry-Run Render
        run: |
          helm template test-release deploy/helm/llm-agent-system --debug

      - name: Validate Canary Rollouts Spec
        run: |
          python3 -m pip install pyyaml
          python3 scripts/verify_helm_readiness.py

  publish-oci:
    name: Package and Publish OCI to GHCR
    needs: lint-and-validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package Helm Chart
        run: |
          mkdir -p .helm-packages
          helm package deploy/helm/llm-agent-system -d .helm-packages

      - name: Push Helm OCI Package to GHCR
        run: |
          CHART_PACKAGE=$(ls .helm-packages/llm-agent-system-*.tgz)
          echo "Publishing ${CHART_PACKAGE} to oci://ghcr.io/${{ github.repository_owner }}/charts"
          helm push "${CHART_PACKAGE}" "oci://ghcr.io/${{ github.repository_owner }}/charts"
