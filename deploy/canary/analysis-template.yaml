apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: llm-agent-system-canary-metric-check
  labels:
    app.kubernetes.io/name: llm-agent-system
spec:
  metrics:
    - name: success-rate
      interval: 30s
      count: 10
      successCondition: result[0] >= 0.999
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-k8s.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{status=~"[23].."}[1m])) 
            / 
            sum(rate(http_requests_total[1m]))

    - name: p99-latency
      interval: 30s
      count: 10
      successCondition: result[0] < 0.500
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-k8s.monitoring.svc.cluster.local:9090
          query: |
            histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[1m])) by (le))

    - name: error-rate
      interval: 30s
      count: 10
      successCondition: result[0] < 0.001
      failureLimit: 3
      provider:
        prometheus:
          address: http://prometheus-k8s.monitoring.svc.cluster.local:9090
          query: |
            sum(rate(http_requests_total{status=~"5.."}[1m])) 
            / 
            sum(rate(http_requests_total[1m]))
