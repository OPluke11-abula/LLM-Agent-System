apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "llm-agent-system.fullname" . }}-config
  labels:
    {{- include "llm-agent-system.labels" . | nindent 4 }}
data:
  LAS_BIND_HOST: {{ .Values.env.LAS_BIND_HOST | quote }}
  PORT: {{ .Values.env.PORT | quote }}
  LAS_ENABLE_REDIS_SWARM: {{ .Values.env.LAS_ENABLE_REDIS_SWARM | quote }}
  LAS_DATA_DIR: {{ .Values.env.LAS_DATA_DIR | quote }}
  LAS_MEMORY_DIR: {{ .Values.env.LAS_MEMORY_DIR | quote }}
  LAS_WORKSPACE_DIR: {{ .Values.env.LAS_WORKSPACE_DIR | quote }}
  LAS_LOG_LEVEL: {{ .Values.env.LAS_LOG_LEVEL | quote }}
