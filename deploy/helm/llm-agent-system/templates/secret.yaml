apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llm-agent-system.fullname" . }}-secret
  labels:
    {{- include "llm-agent-system.labels" . | nindent 4 }}
type: Opaque
data:
  LAS_JWT_SECRET: {{ .Values.secrets.LAS_JWT_SECRET | b64enc | quote }}
  GOOGLE_API_KEY: {{ .Values.secrets.GOOGLE_API_KEY | default "" | b64enc | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.OPENAI_API_KEY | default "" | b64enc | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.ANTHROPIC_API_KEY | default "" | b64enc | quote }}
