# Default values for llm-agent-system Helm chart.
# Production enterprise configuration for distributed agent control plane.

replicaCount: 3

image:
  repository: ghcr.io/opluke11-abula/llm-agent-system
  pullPolicy: IfNotPresent
  tag: "" # Overrides the image tag whose default is the chart appVersion.

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8000"
  prometheus.io/path: "/v1/metrics"

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: agent.las.internal
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: llm-agent-system-tls
      hosts:
        - agent.las.internal

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

persistence:
  enabled: true
  storageClassName: ""
  accessMode: ReadWriteOnce
  size: 20Gi
  mountPath: /app/data

livenessProbe:
  httpGet:
    path: /v1/health
    port: 8000
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /v1/health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 2

env:
  LAS_BIND_HOST: "0.0.0.0"
  PORT: "8000"
  LAS_ENABLE_REDIS_SWARM: "false"
  LAS_DATA_DIR: "/app/data"
  LAS_MEMORY_DIR: "/app/data/memory"
  LAS_WORKSPACE_DIR: "/app/data/workspace"
  LAS_LOG_LEVEL: "INFO"

secrets:
  LAS_JWT_SECRET: "change-me-in-production-jwt-token"
  GOOGLE_API_KEY: ""
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

argoRollouts:
  enabled: false
  strategy: canary

nodeSelector: {}
tolerations: []
affinity: {}
